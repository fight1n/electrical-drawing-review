[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-drawing-review"
version = "0.1.0"
description = "Automated electrical drawing (schematic) review system: parse -> rule filter -> context build -> parallel review -> report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EDR Contributors" }]
keywords = ["electrical", "drawing", "schematic", "review", "llm", "automation"]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39", "openai>=1.30"]
parsers = ["mineru>=1.0", "ezdxf>=1.1", "paddleocr>=2.7"]
dev = ["pytest>=8.0"]

[project.scripts]
edr = "edr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
